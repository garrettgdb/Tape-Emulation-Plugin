name: Build TAPE 01

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build ${{ matrix.os }} VST3
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TAPE-01-Windows-VST3
            build_type: Release
          - os: macos-latest
            artifact: TAPE-01-macOS-VST3
            build_type: Release
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        if: runner.os == 'macOS'

      - name: Configure (Windows)
        run: cmake -S . -B build -A x64
        if: runner.os == 'Windows'

      - name: Build VST3
        run: cmake --build build --config Release --target TAPE_01_VST3 --parallel 2

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/TAPE_01_artefacts/Release/VST3/
          if-no-files-found: error
